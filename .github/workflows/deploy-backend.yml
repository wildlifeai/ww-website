name: Deploy Backend to Azure Container App

on:
  push:
    branches:
      - dev
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: 'Docker image tag (default: latest)'
        required: false
        default: 'latest'
      target:
        description: 'Target environment (dev or staging)'
        required: false
        default: 'auto'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    # Determine environment for secret scoping
    environment: ${{ (github.event.inputs.target == 'dev' || (github.event.inputs.target != 'staging' && github.ref_name == 'dev')) && 'dev' || 'staging' }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Determine target
        id: target
        run: |
          if [[ "${{ (github.event.inputs.target == 'dev' || (github.event.inputs.target != 'staging' && github.ref_name == 'dev')) && 'dev' || 'staging' }}" == "dev" ]]; then
            echo "app_name=ww-backend-dev" >> $GITHUB_OUTPUT
            echo "worker_name=ww-embedding-worker-dev" >> $GITHUB_OUTPUT
            echo "image_tag=dev-${{ github.event.inputs.tag || 'latest' }}" >> $GITHUB_OUTPUT
            echo "env=dev" >> $GITHUB_OUTPUT
            # Dev scales to zero: the API is idle most of the day and an always-on
            # replica was ~1/3 of the Container Apps bill. The trade is a cold start
            # (~1 min) on the first request after idle, which is acceptable for dev.
            echo "min_replicas=0" >> $GITHUB_OUTPUT
          else
            echo "app_name=ww-backend" >> $GITHUB_OUTPUT
            echo "worker_name=ww-embedding-worker" >> $GITHUB_OUTPUT
            echo "image_tag=${{ github.event.inputs.tag || 'latest' }}" >> $GITHUB_OUTPUT
            echo "env=staging" >> $GITHUB_OUTPUT
            # Prod stays warm: the public "Try the demo" button must not hit a
            # ~1-min cold start on the first click.
            echo "min_replicas=1" >> $GITHUB_OUTPUT
          fi

      - name: Log in to Azure Container Registry
        uses: azure/docker-login@v2
        with:
          login-server: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build Docker image
        run: |
          # --target api: build the lean uvicorn API stage. WITHOUT this, Docker
          # builds the LAST stage in the Dockerfile (the ARQ `worker`, CMD `arq …`),
          # which serves no HTTP and fails the health check — the whole backend
          # API would be unreachable. The GPU worker is deployed separately.
          docker build \
            --target api \
            -t ${{ secrets.ACR_LOGIN_SERVER }}/ww-backend:${{ steps.target.outputs.image_tag }} \
            -t ${{ secrets.ACR_LOGIN_SERVER }}/ww-backend:${{ github.sha }} \
            -f backend/Dockerfile \
            backend/

      - name: Push to Azure Container Registry
        run: |
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/ww-backend:${{ steps.target.outputs.image_tag }}
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/ww-backend:${{ github.sha }}

      - name: Log in to Azure CLI
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Container App
        run: |
          echo "Deploying to ${{ steps.target.outputs.app_name }} (${{ steps.target.outputs.env }})"
          # --set-env-vars MERGES the named vars (SUPABASE_* etc. are left intact).
          # DEMO_* come from the environment-scoped GitHub secrets (dev env → dev
          # demo account, staging env → prod demo account). Empty values just leave
          # the "Try the demo" button self-disabled. GitHub masks the values in logs;
          # for higher sensitivity switch to container-app secrets + secretref.
          # --min-replicas is per-environment (see the "Determine target" step):
          # prod stays at 1 so the public "Try the demo" button doesn't hit a ~1-min
          # cold start on the first click; dev is 0 because an always-on idle replica
          # was ~1/3 of the Container Apps spend. Do NOT hardcode this back to 1 —
          # that silently reverts dev to always-on on the next deploy.
          # Deploy by the IMMUTABLE ${{ github.sha }} tag, NOT the mutable dev-latest:
          # ACA compares the image *reference string* and won't roll a new revision when
          # only the code changed (same dev-latest tag + unchanged env) — so the API silently
          # kept running stale code. The SHA tag forces a fresh revision every deploy, exactly
          # as the worker's `revision copy --image :${SHA}` already does below.
          az containerapp update \
            --name ${{ steps.target.outputs.app_name }} \
            --resource-group WW-AE \
            --image ${{ secrets.ACR_LOGIN_SERVER }}/ww-backend:${{ github.sha }} \
            --min-replicas ${{ steps.target.outputs.min_replicas }} \
            --set-env-vars \
              "DEMO_EMAIL=${{ secrets.DEMO_EMAIL }}" \
              "DEMO_PASSWORD=${{ secrets.DEMO_PASSWORD }}"

      - name: Build and deploy the ML worker
        run: |
          # The AI pipeline (SpeciesNet/BioCLIP/DINOv3) runs on the SEPARATE `worker` image,
          # not the lean API above — so it must be rebuilt + rolled here too, or backend code
          # changes never reach the running worker (they didn't, until this step existed).
          REG=$(echo "${{ secrets.ACR_LOGIN_SERVER }}" | cut -d. -f1)   # wwregistry
          WORKER=${{ steps.target.outputs.worker_name }}
          SHA=${{ github.sha }}

          # Build the heavy ARQ `worker` stage in-cloud (ACR) — faster than the runner and no
          # local Docker disk limits. Tag with the env tag (mutable) + the commit SHA (immutable).
          az acr build -r "$REG" --target worker \
            -t "ww-backend-worker:${{ steps.target.outputs.image_tag }}" \
            -t "ww-backend-worker:${SHA}" \
            backend/

          if az containerapp show -n "$WORKER" -g WW-AE -o none 2>/dev/null; then
            # Keep the gated-model HF token synced from the org secret BEFORE the revision
            # copy (the new revision reads the current secret). The worker's HF_TOKEN env is a
            # secretRef to `hf-token`; without it, DINOv3 (gated on HF) 401s and no embeddings
            # are produced. Skip cleanly if the secret isn't configured for this environment.
            if [ -n "${{ secrets.HF_TOKEN }}" ]; then
              az containerapp secret set -n "$WORKER" -g WW-AE --secrets hf-token="${{ secrets.HF_TOKEN }}"
            else
              echo "::warning::HF_TOKEN secret not set — the worker can't download the gated DINOv3 model (Wildlife Brain embeddings will fail)."
            fi

            # `revision copy` clones the CURRENT revision changing only the image — so it PRESERVES
            # the GPU workload profile + the KEDA scale rule (a plain --image / --set-env-vars
            # update has silently blanked the scaler query before) + the HF_TOKEN env (secretRef).
            # The SHA tag forces a fresh pull.
            az containerapp revision copy -n "$WORKER" -g WW-AE \
              --image "${{ secrets.ACR_LOGIN_SERVER }}/ww-backend-worker:${SHA}"

            # Guard: with min-replicas 0 an empty KEDA query means the worker never wakes → no AI.
            Q=$(az containerapp show -n "$WORKER" -g WW-AE \
                  --query "properties.template.scale.rules[0].custom.metadata.query" -o tsv 2>/dev/null || echo "")
            if [ -z "$Q" ]; then
              echo "::error::KEDA scale query is EMPTY on $WORKER — the worker will not wake for jobs. Re-set it in the Portal (Scale → pg-pending) or via a --yaml manifest."
              exit 1
            fi
            echo "Worker $WORKER rolled to ${SHA}; scaler query intact."
          else
            echo "::notice::Worker $WORKER does not exist yet — skipping (see documentation/resources/prod-worker-provisioning-runbook.md)."
          fi

      - name: Verify deployment
        run: |
          FQDN=$(az containerapp show \
            --name ${{ steps.target.outputs.app_name }} \
            --resource-group WW-AE \
            --query "properties.configuration.ingress.fqdn" -o tsv)
          echo "Waiting for container startup..."
          sleep 30
          STATUS=$(curl -s --max-time 60 "https://${FQDN}/health" | python3 -c "import sys,json; print(json.load(sys.stdin).get('status','unknown'))" 2>/dev/null || echo "unreachable")
          echo "Health check (${{ steps.target.outputs.env }}): ${STATUS}"
          if [ "$STATUS" != "ok" ]; then
            echo "::warning::Health check returned '${STATUS}' — container may still be starting"
          fi

      # NOTE: the demo account is NOT seeded here. ww-backend's dev deploy does a
      # destructive `supabase db reset` + re-seed, so the demo user lives in
      # ww-backend's seed (supabase/seeds/dev/data.sql) to survive that reset.
      # This workflow only injects DEMO_EMAIL/DEMO_PASSWORD (above) so the demo
      # endpoint can sign in — DEMO_PASSWORD must equal ww-backend's SEED_USER_PASSWORD.
