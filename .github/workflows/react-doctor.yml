name: React Doctor Review

on:
  pull_request:
    branches: [dev, main]
  workflow_dispatch:
    inputs:
      verbose:
        description: 'Show file details per rule'
        type: boolean
        default: true

jobs:
  react-doctor:
    name: React Doctor Health Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Run React Doctor
        id: doctor
        # Action tag and CLI version are pinned as a pair: the action passes flags
        # the CLI must understand, and @main + version:latest drift independently
        # (broke 2026-06-11: @main passed --scope, which stable 0.5.1 rejects).
        # Bump both together, by hand: Dependabot ignores this action (dependabot.yml),
        # because it can only move the tag and a lone tag bump breaks the scan.
        uses: millionco/react-doctor@v2.1.0
        with:
          directory: 'frontend'
          verbose: ${{ github.event.inputs.verbose || 'true' }}
          node-version: '20'
          version: '0.5.1'

      - name: Report score
        run: |
          echo "## 🩺 React Doctor Score: ${{ steps.doctor.outputs.score }}" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.doctor.outputs.score }}" -lt 99 ]; then
            echo "::error::React Doctor score (${{ steps.doctor.outputs.score }}) is below the required threshold of 99."
            exit 1
          fi
