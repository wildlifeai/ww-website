name: CI — Tests & Lints

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

jobs:
  # ── Backend: Python lint + tests ────────────────────────────────────
  backend-lint:
    name: Backend Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install ruff
        # Pinned: an unpinned latest ruff makes this job break on ruff releases,
        # not on code changes. Bump deliberately together with a format pass.
        run: pip install ruff==0.15.12

      - name: Ruff check
        run: ruff check backend/app/ backend/tests/

      - name: Ruff format check
        run: ruff format --check backend/app/ backend/tests/

      # Advisory until the backlog is down: basic mode reported 1,823 errors
      # in 102 files on 2026-10-05, most of them attribute and index access on
      # untyped Supabase responses. The step prints the count and the first
      # pages of findings, and the job stays green. Drop the continue-on-error
      # to make it blocking once the count is at zero or the noisy modules are
      # excluded in backend/pyrightconfig.json (#225).
      - name: pyright (advisory)
        id: pyright
        working-directory: backend
        continue-on-error: true
        run: |
          pip install pyright
          pyright --outputjson > pyright.json || true
          python - <<'PY'
          import json, collections, sys
          d = json.load(open("pyright.json"))
          s = d["summary"]
          errs = [x for x in d["generalDiagnostics"] if x["severity"] == "error"]
          rules = collections.Counter(x.get("rule", "?") for x in errs).most_common(6)
          print(f"pyright: {s['errorCount']} errors, {s['warningCount']} warnings in {s['filesAnalyzed']} files")
          for r, n in rules: print(f"  {n:5d}  {r}")
          for x in errs[:40]:
              r = x["range"]["start"]
              print(f"{x['file']}:{r['line']+1}:{r['character']+1}: {x['message'].splitlines()[0]}")
          if s["errorCount"]: print(f"... {max(0, s['errorCount'] - 40)} more"); sys.exit(1)
          PY

      - name: Warn when pyright found errors
        if: steps.pyright.outcome == 'failure'
        run: echo "::warning::pyright reports type errors in backend/app (advisory, issue 225). The step above has the count by rule and the first 40."

  backend-tests:
    name: Backend Tests (pytest)
    runs-on: ubuntu-latest
    needs: backend-lint
    env:
      # Minimal env vars for config.py validation (tests mock Supabase)
      SUPABASE_URL: https://test.supabase.co
      SUPABASE_ANON_KEY: test-anon-key
      SUPABASE_SERVICE_ROLE_KEY: test-service-role-key

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements*.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-dev.txt

      - name: Run tests
        working-directory: backend
        run: python -m pytest tests/ -x -q --tb=short

  # ── Frontend: TypeScript lint + build check ─────────────────────────
  frontend-lint:
    name: Frontend Lint (ESLint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: ESLint
        working-directory: frontend
        run: npm run lint

      - name: Unit tests
        working-directory: frontend
        run: npm test

  frontend-build:
    name: Frontend Build Check
    runs-on: ubuntu-latest
    needs: frontend-lint
    env:
      # Env vars needed for vite.config.ts define blocks
      SUPABASE_URL: https://test.supabase.co
      SUPABASE_ANON_KEY: test-anon-key
      VITE_API_BASE_URL: http://localhost:8000

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: TypeScript check + Vite build
        working-directory: frontend
        run: npm run build
