name: CI — Tests & Lints

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

jobs:
  # ── Backend: Python lint + tests ────────────────────────────────────
  backend-lint:
    name: Backend Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install ruff
        # Pinned: an unpinned latest ruff makes this job break on ruff releases,
        # not on code changes. Bump deliberately together with a format pass.
        run: pip install ruff==0.15.12

      - name: Ruff check
        run: ruff check backend/app/ backend/tests/

      - name: Ruff format check
        run: ruff format --check backend/app/ backend/tests/

  backend-tests:
    name: Backend Tests (pytest)
    runs-on: ubuntu-latest
    needs: backend-lint
    env:
      # Minimal env vars for config.py validation (tests mock Supabase)
      SUPABASE_URL: https://test.supabase.co
      SUPABASE_ANON_KEY: test-anon-key
      SUPABASE_SERVICE_ROLE_KEY: test-service-role-key

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements*.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-dev.txt

      # The floor is a ratchet, not a target: set just under the measured figure
      # so it can only move up. 52% of app/ statements on 2026-10-05, floor 50.
      # Raise it by hand when coverage has genuinely climbed (#226).
      - name: Run tests with a coverage floor
        working-directory: backend
        run: python -m pytest tests/ -x -q --tb=short --cov=app --cov-report=term --cov-fail-under=50

  # ── Backend: the image the deploy ships ──────────────────────────────
  # deploy-backend.yml builds `--target api` on a push to dev or main, so a
  # Dockerfile or requirements change that breaks the image used to be found
  # after merge, at deploy time (#224). This builds the same stage on the
  # pull request, then starts it with the test env the pytest job uses and
  # asks for /docs, which proves the entrypoint and the config validation,
  # not just the build. The GPU `worker` stage is deployed separately and
  # pulls the ML requirements, so it is not built here.
  backend-image:
    name: Backend Docker image (api stage)
    runs-on: ubuntu-latest
    needs: backend-lint
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - name: Build the api stage
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          target: api
          push: false
          load: true
          tags: ww-backend:pr
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start it and ask for /docs
        run: |
          docker run -d --name api -p 8000:8000 \
            -e SUPABASE_URL=https://test.supabase.co \
            -e SUPABASE_ANON_KEY=test-anon-key \
            -e SUPABASE_SERVICE_ROLE_KEY=test-service-role-key \
            ww-backend:pr
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/docs >/dev/null; then
              echo "api answered /docs after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::the api image started but /docs did not answer within 30 s"
          docker logs api
          exit 1

  # ── Frontend: TypeScript lint + build check ─────────────────────────
  frontend-lint:
    name: Frontend Lint (ESLint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: ESLint
        working-directory: frontend
        run: npm run lint

      - name: Unit tests
        working-directory: frontend
        run: npm test

  frontend-build:
    name: Frontend Build Check
    runs-on: ubuntu-latest
    needs: frontend-lint
    env:
      # Env vars needed for vite.config.ts define blocks
      SUPABASE_URL: https://test.supabase.co
      SUPABASE_ANON_KEY: test-anon-key
      VITE_API_BASE_URL: http://localhost:8000

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: TypeScript check + Vite build
        working-directory: frontend
        run: npm run build

      # Budgets in frontend/package.json ("size-limit"), brotli-compressed as
      # Cloudflare serves it: the main chunk is 489 kB today against 500 kB. A pull request that
      # pushes a chunk over its limit fails here with the delta; raising a
      # limit is a visible change in the same pull request (#227).
      - name: Bundle size budget
        working-directory: frontend
        run: npm run size

  # ── Documentation: every path and link in the docs resolves ─────────
  docs:
    name: Docs Links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      # No install: the script only uses Node built-ins.
      - name: Validate documentation paths and links
        run: node scripts/validate-docs.js
