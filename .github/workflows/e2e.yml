name: E2E (Playwright)

# Browser checks against a deployed frontend, from e2e/ (see e2e/README.md).
#
# Trigger: Cloudflare Pages posts a GitHub deployment for every branch it
# builds ("Preview" for a branch, "Production" for main). When that deployment
# succeeds, this runs the smoke and demo specs against its URL, so a pull
# request gets its own preview exercised with the dev API behind it. Nothing
# in this workflow builds the frontend: the Pages build is the one users get.
# Production deployments are skipped: the seeded account lives on dev only.
#
# A pull request that changes e2e/ or this file runs the smoke against the
# dev preview (the merged frontend), since the specs themselves are what
# changed. By hand: `workflow_dispatch` with a base URL (default: the dev
# preview) and a suite. `full` adds the upload and LoRaWAN specs, which write
# to the dev database and storage: never point it at production.
#
# The full suite also runs on its own (#217) against the dev preview and the
# dev API: after each successful push deploy of the dev backend
# (deploy-backend.yml), and nightly at 14:17 UTC (03:17 NZDT, 02:17 NZST).
# Both triggers only fire from the copy of this file on the default branch.
# Full runs queue behind each other, never side by side, and end with
# e2e/cleanup.mjs, which deletes what the run wrote even when it failed.
# A red full run is a notification, not a gate: nothing depends on it.
#
# What a green smoke proves: the bundle Cloudflare built from this commit
# renders every public page, the seeded user signs in and reaches every
# authed page, and the demo session is read-only. What it does not prove: the
# backend half of the same pull request, which still deploys from `dev`.

on:
  deployment_status:
  workflow_run:
    workflows: ['Deploy Backend to Azure Container App']
    types: [completed]
    branches: [dev]
  schedule:
    - cron: '17 14 * * *'
  pull_request:
    branches: [dev, main]
    paths:
      - 'e2e/**'
      - '.github/workflows/e2e.yml'
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Frontend under test'
        default: 'https://dev.ww-website.pages.dev'
        required: true
      api_url:
        description: 'FastAPI backend (dev container app)'
        default: 'https://ww-backend-dev.bravesand-8bd2f1d4.australiaeast.azurecontainerapps.io'
        required: true
      suite:
        description: 'smoke: public pages, sign-in, demo. full: also upload and LoRaWAN (writes to dev)'
        type: choice
        options: [smoke, full]
        default: smoke

# A full run gets a group of its own here, so a later smoke on the same ref
# cannot cancel it half-way; the smoke job's `e2e-full` group queues it instead.
concurrency:
  group: e2e-${{ github.event.deployment.sha || ((inputs.suite == 'full' || github.event_name == 'schedule' || github.event_name == 'workflow_run') && format('full-{0}', github.run_id)) || github.ref }}
  cancel-in-progress: true

env:
  E2E_BASE_URL: ${{ inputs.base_url || github.event.deployment_status.environment_url || 'https://dev.ww-website.pages.dev' }}
  E2E_API_URL: ${{ inputs.api_url || vars.E2E_API_URL || 'https://ww-backend-dev.bravesand-8bd2f1d4.australiaeast.azurecontainerapps.io' }}

jobs:
  smoke:
    name: ${{ (inputs.suite == 'full' || github.event_name == 'schedule' || github.event_name == 'workflow_run') && 'E2E Full' || 'E2E Smoke' }}
    if: >-
      (github.event_name != 'deployment_status' || (github.event.deployment_status.state == 'success' && github.event.deployment.environment != 'Production'))
      && (github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-latest
    # The seeded account's password and the dev service-role key live here
    environment: dev
    timeout-minutes: 30
    # Two full runs would share the seeded account and the dev rows the cleanup
    # keys on, so they queue. Any other run is alone in its group.
    concurrency:
      group: ${{ (inputs.suite == 'full' || github.event_name == 'schedule' || github.event_name == 'workflow_run') && 'e2e-full' || format('e2e-smoke-{0}', github.run_id) }}
      cancel-in-progress: false
    env:
      E2E_FULL: ${{ inputs.suite == 'full' || github.event_name == 'schedule' || github.event_name == 'workflow_run' }}
    steps:
      # A scheduled run checks out dev, the branch the dev preview is built from;
      # a post-deploy run checks out the commit that was deployed.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.deployment.sha || github.event.workflow_run.head_sha || (github.event_name == 'schedule' && 'dev') || github.sha }}

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: e2e/package-lock.json

      - name: Install
        working-directory: e2e
        run: npm ci

      - name: Unit-test the cleanup's filters
        if: github.event_name == 'pull_request'
        working-directory: e2e
        run: npm run test:cleanup

      - name: Cache Playwright's Chromium
        id: pw-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('e2e/package-lock.json') }}

      - name: Install Chromium
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Which target
        run: |
          echo "frontend: $E2E_BASE_URL"
          echo "api:      $E2E_API_URL"
          test -n "$E2E_BASE_URL" || { echo "::error::no frontend URL: the deployment carried no environment_url"; exit 1; }

      # What the cleanup keys on: the tag the LoRaWAN rows carry, and the time
      # after which the upload's media rows count as this run's.
      - name: Mark the run
        if: env.E2E_FULL == 'true'
        run: |
          echo "E2E_RUN_TAG=e2e-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"
          echo "E2E_RUN_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Run the flows
        working-directory: e2e
        env:
          CI: 'true'
          E2E_EMAIL: ${{ vars.E2E_EMAIL || 'tui@ww.org' }}
          # Every seeded user shares ww-backend's SEED_USER_PASSWORD, and the dev
          # environment already holds it as DEMO_PASSWORD for the backend deploy
          # (deploy-backend.yml). E2E_PASSWORD overrides it for a dedicated account.
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD || secrets.DEMO_PASSWORD }}
          # The full suite only: the LoRaWAN spec inserts and deletes synthetic rows
          E2E_SUPABASE_URL: ${{ env.E2E_FULL == 'true' && secrets.SUPABASE_URL || '' }}
          E2E_SUPABASE_SERVICE_ROLE_KEY: ${{ env.E2E_FULL == 'true' && secrets.SUPABASE_SERVICE_ROLE_KEY || '' }}
        run: |
          if [ "$E2E_FULL" = "true" ]; then
            npx playwright test specs/01-smoke.spec.ts specs/02-demo.spec.ts specs/03-upload-exif.spec.ts specs/04-lorawan-realtime.spec.ts
          else
            npx playwright test specs/01-smoke.spec.ts specs/02-demo.spec.ts
          fi

      # Pass or fail, delete what the full run wrote to the dev database and
      # storage. cleanup.mjs refuses any project but dev.
      - name: Clean up the run's rows
        if: always() && env.E2E_FULL == 'true' && env.E2E_RUN_STARTED_AT != ''
        working-directory: e2e
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run cleanup

      - name: Results to the job summary
        if: always() && env.E2E_FULL == 'true'
        working-directory: e2e
        env:
          TRIGGER: ${{ github.event_name }}
          DEPLOYED: ${{ github.event.workflow_run.head_sha }}
        run: |
          total=$(grep -c '<testcase' results.xml 2>/dev/null || true)
          failed=$(grep -c '<failure' results.xml 2>/dev/null || true)
          skipped=$(grep -c '<skipped' results.xml 2>/dev/null || true)
          {
            echo "### E2E full suite"
            echo ""
            echo "Trigger: ${TRIGGER}${DEPLOYED:+, backend deploy of $DEPLOYED}. Frontend $E2E_BASE_URL, API $E2E_API_URL."
            echo ""
            echo "Tests ${total:-0}, failed ${failed:-0}, skipped ${skipped:-0}. Screenshots and the HTML report are in the run's artifact."
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

      # The specs skip the signed-in checks when the password is missing, and a
      # skip must not read as a pass. After the run, not before, so the public
      # pages and the demo still report every time (run 36938521947 stopped
      # here with nothing else to show).
      #
      # Except on a Dependabot pull request. Its run sees only Dependabot
      # secrets, and handing it the seed password would hand it to the very
      # package versions the PR is bumping. The sign-in check is skipped there
      # on purpose, and still runs on dev: the preview deployment that follows
      # the merge triggers this workflow as Cloudflare, with the secret.
      - name: Fail if the account is not configured
        if: always()
        env:
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD || secrets.DEMO_PASSWORD }}
          ACTOR: ${{ github.actor }}
        run: |
          if [ -z "$E2E_PASSWORD" ]; then
            if [ "$ACTOR" = "dependabot[bot]" ]; then
              echo "::notice::Dependabot run: the sign-in check is skipped by design and runs on dev after the merge, see e2e/README.md"
              exit 0
            fi
            echo "::error::no password for the seeded account: the dev environment needs E2E_PASSWORD, or the DEMO_PASSWORD the backend deploy already uses, see e2e/README.md"
            exit 1
          fi

      # The specs skip themselves when their env is missing, so a run with a
      # missing secret can "pass" having tested nothing. Count what ran.
      - name: Fail if nothing actually ran
        if: always()
        working-directory: e2e
        run: |
          # grep -c prints 0 itself (and exits 1) when nothing matches
          total=$(grep -c '<testcase' results.xml 2>/dev/null || true)
          skipped=$(grep -c '<skipped' results.xml 2>/dev/null || true)
          echo "test cases: ${total:-0}, skipped: ${skipped:-0}"
          test "${total:-0}" -gt "${skipped:-0}"

      - name: Upload screenshots and report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-smoke-${{ github.event.deployment.sha || github.sha }}
          path: |
            e2e/results.xml
            e2e/test-results/
            e2e/playwright-report/
          retention-days: 7
          if-no-files-found: warn

  a11y:
    name: A11y of public pages
    if: >-
      github.event_name != 'schedule' && github.event_name != 'workflow_run'
      && (github.event_name != 'deployment_status' || (github.event.deployment_status.state == 'success' && github.event.deployment.environment != 'Production'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.deployment.sha || github.sha }}

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: e2e/package-lock.json

      - name: Install
        working-directory: e2e
        run: npm ci

      - name: Cache Playwright's Chromium
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('e2e/package-lock.json') }}

      - name: Install Chromium
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      # No account: the public pages only. Blocking since #213 made them clean:
      # a serious or critical axe violation on a public page fails the job.
      - name: axe-core on the public pages
        working-directory: e2e
        env:
          CI: 'true'
        run: npx playwright test specs/05-a11y.spec.ts

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-a11y-${{ github.event.deployment.sha || github.sha }}
          path: |
            e2e/results.xml
            e2e/playwright-report/
          retention-days: 7
          if-no-files-found: warn

  # Lighthouse on the public pages: performance (largest contentful paint, total
  # blocking time, the size of the main chunk), best practices and SEO, with its
  # accessibility audits as a second opinion to axe. Budgets in e2e/lighthouserc.json.
  # Advisory while the pages are brought up to them (#228): the step fails, the
  # job stays green with a warning annotation, the reports are an artifact.
  lighthouse:
    name: Lighthouse of public pages
    if: >-
      github.event_name != 'schedule' && github.event_name != 'workflow_run'
      && (github.event_name != 'deployment_status' || (github.event.deployment_status.state == 'success' && github.event.deployment.environment != 'Production'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.deployment.sha || github.sha }}

      - name: Lighthouse CI
        id: lhci
        continue-on-error: true
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            ${{ env.E2E_BASE_URL }}/
            ${{ env.E2E_BASE_URL }}/login
            ${{ env.E2E_BASE_URL }}/guides
            ${{ env.E2E_BASE_URL }}/faq
            ${{ env.E2E_BASE_URL }}/resources
          configPath: e2e/lighthouserc.json
          uploadArtifacts: true
          artifactName: lighthouse-${{ github.event.deployment.sha || github.sha }}
          temporaryPublicStorage: false

      - name: Warn when a page misses its budget
        if: steps.lhci.outcome == 'failure'
        run: echo "::warning::Lighthouse found a public page under its budget (advisory, issue 228). The lighthouse artifact has the reports, e2e/lighthouserc.json the budgets."
