# Keeps GitHub Actions pins current via PRs. Workflow dependencies are pinned
# (actions to release tags, CLIs to exact versions) so upstream releases can't
# silently break CI; this config is how those pins get bumped deliberately.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Into dev like every other change, as in ww-backend and ww-mobile-app; a release
    # carries it to main. Security updates still target main, whatever this says.
    target-branch: dev
    groups:
      actions:
        patterns:
          - '*'
    ignore:
      # Paired with the CLI version pinned in react-doctor.yml (v2.2.9 + 0.9.12); bump both by hand.
      - dependency-name: millionco/react-doctor

  # The site, the browser flows and the API. One grouped PR a week per
  # ecosystem and update type, into dev like everything else; security
  # updates ignore the grouping and open on their own.
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    target-branch: dev
    open-pull-requests-limit: 5
    groups:
      # Packages that peer-depend on each other's major move together, majors
      # included: eslint 10 alone, or @size-limit/file 14 alone, fails npm ci.
      # A package goes to the first group it matches, so these sit first.
      lint:
        patterns:
          - eslint
          - '@eslint/*'
          - eslint-plugin-*
          - typescript-eslint
          - globals
      size-limit:
        patterns:
          - size-limit
          - '@size-limit/*'
      frontend-minor-and-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: npm
    directory: /e2e
    schedule:
      interval: weekly
    target-branch: dev
    open-pull-requests-limit: 3
    groups:
      e2e-minor-and-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    target-branch: dev
    open-pull-requests-limit: 5
    # The requirements are floors (>=) with no lockfile, so a PR that only
    # raises a floor changes nothing that gets installed. Only move a
    # requirement when the new release falls outside it, such as a == pin.
    versioning-strategy: increase-if-necessary
    groups:
      backend-minor-and-patch:
        update-types:
          - minor
          - patch
